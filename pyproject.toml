[build-system]
# 64+ for PEP 660 editable installs (`pip install -e .`).
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bellwether"
version = "0.1.0"
description = "Real-time trading system for the SIG Predictions Cup 2026"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "pydantic>=2",
    "pyyaml",
    "pytest",
    "ruff==0.16.10",
    # The realtime socket adapter (engine/sig_client/realtime_socket.py). Pinned: its
    # precision proof and protocol notes cite this exact version's source.
    "websockets==15.0.1",
]

[tool.setuptools]
# No runtime data files: shared/schemas.json is a dashboard export kept in the repo.
include-package-data = false

[tool.setuptools.packages.find]
# Flat layout with several top-level folders, so list the Python code folders
# explicitly. Everything else (tests, dashboard, data, docs, config, markets) is left out.
# namespaces = false: a folder is installed only once it has an __init__.py.
include = [
    "engine", "engine.*",
    "models", "models.*",
    "mock_exchange", "mock_exchange.*",
    "shared", "shared.*",
]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests", "bot/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
