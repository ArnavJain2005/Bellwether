[project]
name = "bellwether"
version = "0.1.0"
description = "Real-time trading system for the SIG Predictions Cup 2026"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "pydantic>=2",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
